name: Unity Build

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build:
    name: Build Unity Project
    runs-on: [self-hosted, Windows, X64]
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
      
      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-
            Library-
      
      - name: Activate Unity License
        run: |
          "C:\Program Files\Unity\Hub\Editor\2022.3.62f2\Editor\Unity.exe" -quit -batchmode -nographics -username "${{ env.UNITY_EMAIL }}" -password "${{ env.UNITY_PASSWORD }}" -logFile activate.log
        continue-on-error: true
        shell: cmd
      
      - name: Export commit subject
        shell: powershell
        run: |
          $msg = (git log -1 --pretty=%s)
          Add-Content $env:GITHUB_ENV ("GIT_COMMIT_SUBJECT=" + $msg)

      - name: Build for Android
        run: |
          "C:\Program Files\Unity\Hub\Editor\2022.3.62f2\Editor\Unity.exe" -quit -batchmode -nographics -projectPath "${{ github.workspace }}" -buildTarget Android -executeMethod BuildScript.BuildAndroid -logFile build.log
        shell: cmd
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts
          path: |
            Builds/
            Logs/
          retention-days: 7
